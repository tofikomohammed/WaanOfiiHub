name: waan_ofii_hub
description: "WAAN-OFIIHUB - Blog and Chat app with Dynamic Role-Based Access"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Backend & Supabase
  supabase_flutter: ^2.8.4

  # Storage & Utilities
  shared_preferences: ^2.5.2
  intl: ^0.20.2
  crypto: ^3.0.6
  path_provider: ^2.1.5
  url_launcher: ^6.3.1

  # Media & Hardware (for subsequent phases)
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  permission_handler: ^11.4.0
  record: ^7.2.0
  just_audio: ^0.10.6
  flutter_contacts: ^2.6.0
  flutter_image_compress: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
